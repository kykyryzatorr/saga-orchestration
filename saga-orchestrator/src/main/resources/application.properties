server.port=8084

spring.application.name=saga-orchestrator

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5435/orchestrator_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.consumer.group-id=saga-orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest

# gRPC server
grpc.server.port=9084

# gRPC clients
grpc.client.payment-service.address=static://localhost:9081
grpc.client.payment-service.negotiation-type=plaintext
grpc.client.order-service.address=static://localhost:9082
grpc.client.order-service.negotiation-type=plaintext
grpc.client.inventory-service.address=static://localhost:9083
grpc.client.inventory-service.negotiation-type=plaintext

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.saga.orchestrator=DEBUG
logging.level.org.springframework.kafka=INFO

# Outbox poller
outbox.poller.fixed-delay-ms=2000
outbox.poller.batch-size=50
outbox.poller.send-timeout-ms=5000

# Saga recovery poller — detects sagas stuck in STARTED/COMPENSATING and resends the
# last outstanding command, escalating to FAILED after max attempts.
saga.recovery.fixed-delay-ms=30000
saga.recovery.stuck-threshold-seconds=120
saga.recovery.batch-size=20
saga.recovery.max-attempts=5
